[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ompnn"
version = "0.1.0"
description = "OpenMP feed-forward neural network library (CPU + target offload, CBLAS/cuBLAS/rocBLAS), 1:1 port of syclnn"
license = "LGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
authors = [{ name = "Antonio Napolitano", email = "anton@polit.no" }]

[project.urls]
Homepage = "https://github.com/napanto/ompnn"

[tool.scikit-build]
cmake.version = ">=3.26"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/ompnn"]
editable.mode = "redirect"
sdist.exclude = ["build/", ".cache/", "*.so"]

[tool.scikit-build.cmake.define]
OMPNN_TARGET = { env = "OMPNN_TARGET", default = "cpu" }
OMPNN_OFFLOAD_ARCH = { env = "OMPNN_OFFLOAD_ARCH", default = "" }
OMPNN_BLAS = { env = "OMPNN_BLAS", default = "openblas" }
OMPNN_BLAS_ROOT = { env = "OMPNN_BLAS_ROOT", default = "" }
OMPNN_FAST_MATH = { env = "OMPNN_FAST_MATH", default = "OFF" }
OMPNN_BUILD_BENCH = "OFF"
